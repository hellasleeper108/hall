<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HALL 1.3</title>
  <link rel="stylesheet" href="/css/workbench.css">
</head>
<body>
  <div id="pointer" aria-hidden="true">
    <svg viewBox="0 0 16 16" class="idle" shape-rendering="crispEdges">
      <path fill="#000" d="M1 1h2v12H1V1zm2 0h1v1H3V1zm1 1h1v1H4V2zm1 1h1v1H5V3zm1 1h1v1H6V4zm1 1h1v1H7V5zm1 1h1v1H8V6zm1 1h1v1H9V7zm1 1h1v1h-1V8z"/>
      <path fill="#ff8800" d="M2 2h1v10H2V2zm1 1h1v8H3V3zm1 1h1v3H4V4zm1 1h1v2H5V5z"/>
      <path fill="#fff" d="M2 2h1v1H2V2z"/>
    </svg>
    <svg viewBox="0 0 16 16" class="busy" shape-rendering="crispEdges">
      <rect x="3" y="3" width="10" height="10" fill="#000"/>
      <rect x="4" y="4" width="8" height="8" fill="#ff8800"/>
      <rect x="7" y="4" width="2" height="4" fill="#000"/>
      <rect x="7" y="7" width="4" height="2" fill="#000"/>
    </svg>
  </div>

  <div id="boot">
    <div class="floppy" aria-hidden="true">
      <div class="disk">
        <div class="label">HALL<br>WB 1.3<br>DF0:</div>
        <div class="hub"></div>
      </div>
    </div>
    <div class="rom"></div>
    <div class="bar"><i></i></div>
    <div class="hint">CLICK OR PRESS RETURN TO SKIP</div>
    <button id="skip" style="position:absolute;inset:0;opacity:0;cursor:none" aria-label="Skip boot"></button>
  </div>

  <div id="workbench">
    <div id="menubar">
      <div class="brand"><b>WB</b>  HALL 1.3  CHIP:2048K  FAST:8192K</div>
      <div class="clock"><span id="led" title="DF0 motor"></span><span id="hour-pill"></span>  <span id="clock"></span></div>
    </div>

    <div id="desktop">
      <div id="boing" aria-hidden="true"></div>

      <button class="icon" style="left:18px;top:16px" data-open="cli">
        <svg class="glyph" viewBox="0 0 48 40" shape-rendering="crispEdges">
          <rect x="4" y="4" width="40" height="28" fill="#fff"/>
          <rect x="6" y="6" width="36" height="24" fill="#000"/>
          <rect x="10" y="12" width="10" height="3" fill="#ff8800"/>
          <rect x="22" y="20" width="14" height="3" fill="#fff"/>
        </svg>
        <span class="name">CLI</span>
      </button>
      <button class="icon" style="left:18px;top:100px" data-open="files">
        <svg class="glyph" viewBox="0 0 48 40" shape-rendering="crispEdges">
          <rect x="10" y="4" width="28" height="30" fill="#ff8800"/>
          <rect x="12" y="6" width="24" height="10" fill="#fff"/>
          <circle cx="24" cy="26" r="5" fill="#000"/>
          <circle cx="24" cy="26" r="2" fill="#fff"/>
        </svg>
        <span class="name">FILES</span>
      </button>
      <button class="icon" style="left:18px;top:184px" data-open="scroll">
        <svg class="glyph" viewBox="0 0 48 40" shape-rendering="crispEdges">
          <rect x="10" y="6" width="28" height="28" fill="#fff"/>
          <rect x="14" y="12" width="20" height="3" fill="#0055aa"/>
          <rect x="14" y="18" width="14" height="3" fill="#000"/>
          <rect x="14" y="24" width="18" height="3" fill="#000"/>
        </svg>
        <span class="name">SCROLL</span>
      </button>
      <button class="icon" style="left:18px;top:268px" data-open="xref">
        <svg class="glyph" viewBox="0 0 48 40" shape-rendering="crispEdges">
          <rect x="6" y="8" width="36" height="24" fill="#fff"/>
          <rect x="8" y="10" width="32" height="4" fill="#0055aa"/>
          <rect x="10" y="18" width="10" height="3" fill="#000"/>
          <rect x="24" y="18" width="10" height="3" fill="#ff8800"/>
          <rect x="10" y="24" width="22" height="3" fill="#000"/>
        </svg>
        <span class="name">XREF</span>
      </button>
      <button class="icon" style="left:18px;top:352px" data-open="door">
        <svg class="glyph" viewBox="0 0 48 40" shape-rendering="crispEdges">
          <rect x="8" y="6" width="32" height="28" fill="#000"/>
          <rect x="10" y="8" width="28" height="24" fill="#fff"/>
          <rect x="14" y="14" width="8" height="8" fill="#ff8800"/>
          <rect x="26" y="14" width="8" height="8" fill="#0055aa"/>
        </svg>
        <span class="name">DOOR</span>
      </button>
      <button class="icon" style="left:18px;top:436px" data-open="about">
        <svg class="glyph" viewBox="0 0 48 40" shape-rendering="crispEdges">
          <rect x="8" y="6" width="32" height="28" fill="#ff8800"/>
          <rect x="12" y="10" width="24" height="10" fill="#fff"/>
          <circle cx="24" cy="26" r="4" fill="#000"/>
        </svg>
        <span class="name">SYS:</span>
      </button>

      <div id="win-cli" class="win cli active" style="left:66%;top:24px;width:32%;height:260px">
        <div class="titlebar">
          <button class="gadget close">×</button>
          <div class="title">SYS:HallTerm</div>
          <button class="gadget right zoom">□</button>
          <button class="gadget right depth">▬</button>
        </div>
        <div class="body">
          <div id="term">
            <div id="term-log"></div>
            <div class="prompt-row">
              <span class="ps">1&gt;&nbsp;</span>
              <input id="cmdline" autocomplete="off" spellcheck="false" aria-label="CLI">
            </div>
          </div>
        </div>
        <div class="resize"></div>
      </div>

      <div id="win-files" class="win" hidden style="left:110px;top:24px;width:54%;height:58%">
        <div class="titlebar">
          <button class="gadget close">×</button>
          <div class="title">DH0:Files</div>
          <button class="gadget right zoom">□</button>
          <button class="gadget right depth">▬</button>
        </div>
        <div class="body">
          <div class="shelf-head">
            <span>FILE AREA  51 NODES  3 DEPTHS</span>
            <span class="src" id="file-src"></span>
          </div>
          <div class="filters" id="echo-filters"></div>
          <div id="file-list"></div>
        </div>
        <div class="resize"></div>
      </div>

      <div id="win-scroll" class="win" hidden style="left:120px;top:40px;width:58%;height:64%">
        <div class="titlebar">
          <button class="gadget close">×</button>
          <div class="title">DH1:Scroll</div>
          <button class="gadget right zoom">□</button>
          <button class="gadget right depth">▬</button>
        </div>
        <div class="body">
          <div id="scroll-meta"></div>
          <div class="filters" id="depth-tabs">
            <button data-depth="signal" class="on">NFO</button>
            <button data-depth="translation">TXT</button>
            <button data-depth="folio">FOL</button>
          </div>
          <div id="scroll-body" class="doc-excerpt"></div>
          <div id="scroll-also"></div>
          <div id="rite-box" hidden></div>
        </div>
        <div class="resize"></div>
      </div>

      <div id="win-xref" class="win" hidden style="left:110px;top:62%;width:calc(100% - 128px);height:28%">
        <div class="titlebar">
          <button class="gadget close">×</button>
          <div class="title">XREF:See</div>
          <button class="gadget right zoom">□</button>
          <button class="gadget right depth">▬</button>
        </div>
        <div class="body">
          <div class="filters">
            <input id="xref-q" placeholder="mercury, fool, hiram, tree…" autocomplete="off" spellcheck="false">
            <button id="xref-go">FIND</button>
          </div>
          <div id="xref-body"></div>
        </div>
        <div class="resize"></div>
      </div>

      <div id="win-door" class="win" hidden style="left:360px;top:72px;width:460px;height:340px">
        <div class="titlebar">
          <button class="gadget close">×</button>
          <div class="title">NUM:Gematria</div>
          <button class="gadget right zoom">□</button>
          <button class="gadget right depth">▬</button>
        </div>
        <div class="body">
          <p class="dim">English ordinal on Hall's folio. Codex keeps the Hebrew desk.</p>
          <div class="filters">
            <input id="gem-q" placeholder="HIRAM" autocomplete="off" spellcheck="false">
            <button id="gem-go">SUM</button>
          </div>
          <div id="gem-body"></div>
        </div>
        <div class="resize"></div>
      </div>

      <div id="win-about" class="win" hidden style="left:380px;top:96px;width:420px;height:320px">
        <div class="titlebar">
          <button class="gadget close">×</button>
          <div class="title">SYS:About</div>
          <button class="gadget right zoom">□</button>
          <button class="gadget right depth">▬</button>
        </div>
        <div class="body">
          <div id="about-body"></div>
        </div>
        <div class="resize"></div>
      </div>
    </div>

    <div id="copper" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
